name: ci

on:
  pull_request:
    branches:
      - dev
      - hml
      - main
  push:
    branches:
      - dev
      - hml
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell and Python
        run: |
          bash -n scripts/init-dirs.sh
          bash -n scripts/bootstrap.sh
          python3 -m py_compile scripts/bootstrap.py scripts/check-factory.py
          python3 scripts/check-factory.py
      - name: Validate compose file
        env:
          VPN_SERVICE_PROVIDER: custom
          WIREGUARD_PRIVATE_KEY: dummy
          WIREGUARD_ADDRESSES: 10.0.0.2/32
          PUID: "1000"
          PGID: "1000"
          TZ: America/Sao_Paulo
          CONFIG_ROOT: /tmp/servarr-config
          DATA_ROOT: /tmp/servarr-data
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml config --format json > /tmp/compose.json
          python3 scripts/check-factory.py /tmp/compose.json
